# enrich.yml — MANUAL full-catalogue price-enrichment tool (injected into the
# enrich repo by deploy/deploy.py --enrich).
#
# Routine high-value enrichment now runs INLINE right after each store's scrape
# (see store-scrape.yml). This repo is kept as a manual, on-demand tool for a
# deeper pass — e.g. re-enrich the WHOLE catalogue with `min_price = 0`.
#
# Secrets required (set by deploy.py --enrich):
#   DATABASE_URL_DROGASIL, DATABASE_URL_DROGARAIA  — target store DBs
#   DB_ARCHIVE_GITHUB_TOKEN, DB_ARCHIVE_GITHUB_REPO

name: Enrich Prices

concurrency:
  group: enrich
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      min_price:
        description: "Only enrich products with regular_price >= this (0 = whole catalogue)"
        required: false
        default: "1000"
      limit:
        description: "Max products per store (empty = no limit, for testing)"
        required: false
        default: ""

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        store: [drogasil, drogaraia]   # parallel jobs — each store gets its own 6h budget

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create .env from secrets
        shell: python
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          import os, json
          secrets = json.loads(os.environ['ALL_SECRETS'])
          written = 0
          with open('.env', 'w') as f:
              for key, val in secrets.items():
                  if key.startswith('DATABASE_URL_') or key in ('DB_ARCHIVE_GITHUB_TOKEN', 'DB_ARCHIVE_GITHUB_REPO'):
                      if val:
                          f.write(f'{key}={val}\n')
                          written += 1
          print(f'Created .env with {written} variables')

      - name: Run price enrichment
        run: |
          ARGS="${{ matrix.store }} --workers 30 --min-price ${{ inputs.min_price }}"
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python -m enrich_prices $ARGS
